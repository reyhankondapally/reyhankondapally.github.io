        title: "IgnisFire (Fire Prevention System)",
        subtitle: "An automatic fire-extinguishing system",
        photo: "",
        description:
          "I created IgnisFire to help combat in-flight fires on primarily cargo aircraft. After researching aircraft crashes, I came across UPS Flight 6. It crashed over Dubai due to an inflight fire that started from undeclared lithium-ion batteries. The pilots got a master caution in the cockpit but due to the length of checklists and reaction time, the lives and the aircraft couldn't have been saved. This is why IgnisFire is an automatic fire extinguishing system. My system prototype has 3 sensors. A temperature and humidity sensor; a smoke sensor; and a fire sensor. All of my sensors are attached to an Arduino board as well as an LCD screen and a water pump. The real aircraft system would use a fire extinguishing foam. IgnisFire requires two high alert readings from two different sensors to activate the water pump. The only instance where IgnisFire will not require two readings is if it gets a fire warning from the fire sensor. IgnisFire can use readings given by the sensors to predict fires. ",
        challenges:
          "There were many challenges in creating this system such as writing the code and analyzing different errors. The major error in my first version was the relay which activates the water pump was not activating. I had to open up the relay and re-solder a part that wasnt soldered properly. Another major issue was the fact that the motor was creating electronic interference through its magnetic field and electrical switching and it was corrupting the relay and the information displayed on the LCD screen. The LCD was just displaying random symbols. To fix this, I added a 100 microfarad capacitor across the 5 Volt and the Ground pins of the LCD. I also added a 100 microfarad capacitor along the positive and negative wires of the motor as well as a diode. The last thing I did to fix this was I moved the motor around 2 feet away from the circuit board to reduce interference from the magnetic field.",
        improvements:
          "Next time I would create a structured wooden platform and have multiple places to put the pump at different distances from the circuit board so I can experiment and test different configurations which have the potential to work better. I would also keep in mind that electrical intereference is very common in circuits with spinning magnets. Another thing I would do is quality check every part before installing it so I wouldn't have to extract the part from the circuit, fix it, and install the part again."
