
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | Reyhan Kondapally</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080d17;
      color: #e8edf5;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.8;
    }

    a {
      color: #70d8ff;
      text-decoration: none;
    }

    a:hover {
      color: white;
    }

    nav {
      padding: 20px 8%;
      border-bottom: 1px solid #202c3d;
    }

    .logo {
      color: white;
      font-weight: bold;
      letter-spacing: 1px;
    }

    main {
      width: min(820px, 88%);
      margin: auto;
      padding: 48px 0 80px;
    }

    .back {
      display: inline-block;
      margin-bottom: 35px;
      font-size: 14px;
    }

    .eyebrow {
      color: #70d8ff;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.2;
      margin: 12px 0 18px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #b9c5d7;
      font-size: 17px;
    }

    .project-visual {
      min-height: 220px;
      aspect-ratio: 16 / 7;
      margin: 30px 0 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #142b42, #101827);
      border: 1px solid #25354b;
      border-radius: 10px;
      color: #70d8ff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .project-visual img {
      width: 100%;
      height: 100%;
      min-height: 220px;
      max-height: 430px;
      object-fit: contain;
      border-radius: 9px;
    }

    section {
      margin: 38px 0;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 13px;
      padding-bottom: 9px;
      border-bottom: 1px solid #25354b;
    }

    section p {
      color: #b9c5d7;
      white-space: pre-line;
    }

    .detail-panel {
      padding: 24px;
      background: #101a2a;
      border: 1px solid #25354b;
      border-radius: 10px;
    }

    .detail-panel h2 {
      color: #70d8ff;
    }

    /* Images underneath Description, Challenges, and Improvements */
    .section-photo {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 20px 0 35px;
      border-radius: 12px;
      border: 1px solid #263849;
    }

    .edit-note {
      margin-top: 35px;
      color: #8293aa;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 28px 20px;
      border-top: 1px solid #202c3d;
      color: #8493a9;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      nav {
        padding: 18px 5%;
      }

      main {
        width: 90%;
      }

      .detail-panel {
        padding: 19px;
      }

      .section-photo {
        margin: 15px 0 28px;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a class="logo" href="index.html">RK / ENGINEERING</a>
  </nav>

  <main>
    <a class="back" href="index.html#projects">
      ← Back to all projects
    </a>

    <div class="eyebrow" id="project-number">PROJECT DETAILS</div>
    <h1 id="project-title">Loading project...</h1>
    <p class="subtitle" id="project-subtitle"></p>

    <div class="project-visual" id="project-visual">
      ADD YOUR PROJECT PHOTO
    </div>

    <!-- Description now has the same blue box as the other sections -->
    <section class="detail-panel">
      <h2>Description</h2>
      <p id="project-description"></p>
    </section>

    <img class="section-photo" id="description-image"
         src="" alt="Project description image" hidden>

    <section class="detail-panel">
      <h2>Challenges</h2>
      <p id="project-challenges"></p>
    </section>

    <img class="section-photo" id="challenges-image"
         src="" alt="Project challenges image" hidden>

    <section class="detail-panel">
      <h2>Improvements</h2>
      <p id="project-improvements"></p>
    </section>

    <img class="section-photo" id="improvements-image"
         src="" alt="Project improvements image" hidden>

    <p style="margin-top:30px">
      <a href="index.html#projects">
        ← Return to project collection
      </a>
    </p>
  </main>

  <footer>Reyhan Kondapally · Maker Portfolio</footer>

  <script>
    const projects = {
      "ignisfire": {
        number: "PROJECT 01 / PATENT PENDING SAFETY SYSTEM",
        title: "IgnisFire (Fire Prevention System)",
        subtitle: "An automatic fire-extinguishing system",
        photo: "",
        description:
          "I created IgnisFire to help combat in-flight fires on primarily cargo aircraft. After researching aircraft crashes, I came across UPS Flight 6. It crashed over Dubai due to an inflight fire that started from undeclared lithium-ion batteries. The pilots got a master caution in the cockpit but due to the length of checklists and reaction time, the lives and the aircraft couldn't have been saved. This is why IgnisFire is an automatic fire extinguishing system. My system prototype has 3 sensors. A temperature and humidity sensor; a smoke sensor; and a fire sensor. All of my sensors are attached to an Arduino board as well as an LCD screen and a water pump. The real aircraft system would use a fire extinguishing foam. IgnisFire requires two high alert readings from two different sensors to activate the water pump. The only instance where IgnisFire will not require two readings is if it gets a fire warning from the fire sensor. IgnisFire can use readings given by the sensors to predict fires. ",
        challenges:
          "There were many challenges in creating this system such as writing the code and analyzing different errors. The major error in my first version was the relay which activates the water pump was not activating. I had to open up the relay and re-solder a part that wasnt soldered properly. Another major issue was the fact that the motor was creating electronic interference through its magnetic field and electrical switching and it was corrupting the relay and the information displayed on the LCD screen. The LCD was just displaying random symbols. To fix this, I added a 100 microfarad capacitor across the 5 Volt and the Ground pins of the LCD. I also added a 100 microfarad capacitor along the positive and negative wires of the motor as well as a diode. The last thing I did to fix this was I moved the motor around 2 feet away from the circuit board to reduce interference from the magnetic field.",
        improvements:
          "Next time I would create a structured wooden platform and have multiple places to put the pump at different distances from the circuit board so I can experiment and test different configurations which have the potential to work better. I would also keep in mind that electrical intereference is very common in circuits with spinning magnets. Another thing I would do is quality check every part before installing it so I wouldn't have to extract the part from the circuit, fix it, and install the part again."
      },

      "airfoil-research": {
        number: "PROJECT 02 / AIRFOIL RESEARCH",
        title: "Airfoil Research",
        subtitle: "Investigating airfoil geometry, angle of attack, and flow behavior",
        photo: "",
        description:
          "I used Computational Fluid Dynamics (CFD) to analyze how different airfoil geometries behave in incompressible and compressible flow regimes. I studied how airflow changed as conditions moved into the compressible regime and observed the formation of shockwaves. Using what I learned from these simulations, I designed a wing shape intended to perform efficiently in both compressible and incompressible flow. This project helped me understand how airfoil geometry affects aerodynamic performance under different flow conditions.",
        challenges:
          "One of the main challenges was comparing how different airfoil shapes behaved across compressible and incompressible flow regimes. An airfoil that performs well under one set of conditions may not perform as well under another. I had to use CFD to examine the airflow and understand how the changes in flow behavior affected the performance of each shape.",
        improvements:
          "My next step is to continue refining the wing geometry to improve its efficiency in both compressible and incompressible flow. I would compare additional designs using CFD and evaluate how each shape affects the airflow and shockwave formation under different conditions."
      },

      "airfoil-implementation": {
        number: "PROJECT 03 / RESEARCH APPLICATION",
        title: "Airfoil Implementation",
        subtitle: "Translating aerodynamic analysis into a design",
        photo: "",
        description:
          "I took the airfoil I researched and designed using CFD and applied it to the Vought F4U Corsair I built. My goal was to incorporate my own aerodynamic design into an actual aircraft while maintaining the Corsair’s iconic inverted gull-wing shape. This allowed me to take my research beyond a simulation and apply it to a physical aircraft design.",
        challenges:
          "One of the main challenges was incorporating my airfoil into the Corsair’s distinctive inverted gull-wing configuration. I had to consider how to apply the airfoil shape to the wing while maintaining the overall geometry that makes the Corsair recognizable. Another challenge was translating the airfoil from a digital design into a physical model, where the intended shape had to be recreated during construction.",
        improvements:
          "Next, I would refine the process of transferring my airfoil design into the physical wing to improve its accuracy. I would also use CFD to analyze the completed wing configuration and investigate how the airfoil performs when incorporated into the Corsair’s inverted gull-wing design."
      },

      "wind-tunnel": {
        number: "PROJECT 04 / WIND TUNNEL BUILD AND TEST",
        title: "Wind Tunnel",
        subtitle: "Building a setup to investigate airflow over airfoil cross sections",
        photo: "",
        description:
          "I built my own wind tunnel to observe airflow over different airfoil geometries. I attached strings along the airfoils and tested them at different angles of attack, watching how the strings moved as air traveled over the wings. This gave me a visual way to investigate airflow and compare how changes in wing geometry and angle of attack affected the flow. Instead of relying only on simulations, I could observe airflow behavior through a physical experiment.",
        challenges:
          "One challenge was setting up the experiment so I could compare different airfoil geometries and angles of attack. I needed to position the airfoils and strings so their movement could help me observe changes in the airflow.",
        improvements:
          "Next, I would improve the wind tunnel setup to make comparisons more consistent and easier to document. I would test a wider range of angles of attack and airfoil geometries, record the results, and compare my physical observations with the airflow patterns predicted by CFD."
      },

      "corsair": {
        number: "PROJECT 05 / RC CORSAIR",
        title: "Vought F4U Corsair",
        subtitle: "Building a model of the distinctive inverted gull-wing fighter",
        photo: "",
        description:
          "I built a model of the Vought F4U Corsair using the airfoil I researched and designed. The Corsair’s iconic inverted gull-wing shape made it an interesting aircraft to build because I had to work with a distinctive wing configuration while incorporating my own airfoil design. This project allowed me to apply my aerodynamic research to a physical aircraft rather than leaving the design in a CFD simulation.",
        challenges:
          "One of the main challenges was learning how to create the airfoil shape. Translating an aerodynamic design into a physical wing required me to figure out how to construct the shape accurately enough to incorporate it into the aircraft.",
        improvements:
          "Next, I would refine how I construct the airfoil so the finished wing more closely matches my intended design. I would also evaluate the completed aircraft’s aerodynamic performance to better understand how my airfoil works in practice."
      },

      "fokker-dr1": {
        number: "PROJECT 06 / RC FOKKER DR1",
        title: "Fokker DR1",
        subtitle: "Buiding a triplane (3 wings)",
        photo: "",
        description:
          "built a model of the Fokker DR-1, which required me to construct the wings and fuselage and fit the aircraft’s electronic components into the finished structure. Beyond shaping the aircraft, I had to work with the motor and servos and find a way to fit the wiring into the limited space available. The project gave me hands-on experience with both aircraft construction and the challenges of integrating electronics into a compact airframe.",
        challenges:
          "Cutting out the wings and constructing the fuselage were two of the main challenges. I also had difficulty wiring the motor and servos because the aircraft had such a small amount of internal space. I had to account for the physical layout of the components while working within the fuselage.",
        improvements:
          "Next, I would plan the internal component layout earlier in the building process. I would also pay closer attention to wire routing and component placement so the electronics are easier to install and maintain without interfering with the aircraft’s structure."
      },

      "wee-papillon": {
        number: "PROJECT 07 / MY FIRST RC AIRCRAFT",
        title: "Wee Papillon",
        subtitle: "First RC aircraft",
        photo: "",
        description:
          "The Wee Papillon was my first RC aircraft. Before building it, I had to learn what each component did and how the components interacted with one another. I learned how the different parts worked together to make the aircraft controllable, then applied that knowledge to assembling the plane. After building it, I had to learn how to fly it. This project introduced me to RC aircraft and gave me a foundation for the more complex aircraft I built afterward.",
        challenges:
          "The biggest challenge was learning the purpose of every component and understanding how they worked together. Since this was my first RC aircraft, I had to build my understanding of the system before I could confidently assemble it. Learning to fly the aircraft was another challenge because building a plane and controlling it in the air required different skills.",
        improvements:
          "If I built the Wee Papillon again, I would document the purpose and connections of each component as I assembled it. I would also use what I learned from flying it to identify areas where I could improve my understanding of aircraft setup and control."
      },

      "mousetrap-car": {
        number: "PROJECT 08 / MOUSETRAP CAR",
        title: "Mousetrap Car",
        subtitle: "Designing and building a mousetrap car from scratch",
        photo: "",
        description:
          "I designed and built a mousetrap-powered car from scratch. Before I could build it, I had to figure out how the mechanism would work and how to translate the idea into a functioning vehicle. I used CDs as wheels and connected the mousetrap mechanism to the rear axle to power the car. Building it required me to think through the design of the entire system and troubleshoot problems that appeared once the car was assembled.",
        challenges:
          "One of the main challenges was figuring out how to design the car and make the mousetrap mechanism power it. After building it, I noticed that the CD wheels kept slipping on my wood floor. Since the mousetrap powered the rear axle, I added two 20-gram weights to the back of the car to increase the load on the driven wheels and help them grip the floor.",
        improvements:
          "Next, I would add thin rubber strips around the edges of the wheels to improve traction. This would address the slipping directly instead of relying on additional weight. I would then compare the car’s performance before and after the change to determine whether the added grip improved its movement."
      },

      "automata-cad": {
        number: "PROJECT 09 / AUTOMATA BOX DESIGN",
        title: "Automata CAD",
        subtitle: "Modeling mechanical motion through computer-aided design (Fusion360)",
        photo: "",
        description:
          "I designed an automata box using Fusion 360. The project involved designing the mechanism and its individual components in CAD, including a pear-shaped cam. I had to consider how the parts would fit together and how their arrangement would allow the mechanism to function. The project introduced me to the challenges of designing a mechanical system in which individual components must work together.",
        challenges:
          "One of the hardest parts was designing the pear-shaped cam. I also ran into problems when joining the components because I assembled them in the wrong way. This showed me that designing individual parts is only one part of creating a working mechanism; the assembly and relationships between the components are just as important.",
        improvements:
          "Next, I would plan the assembly more carefully before joining the components. I would also check how the cam interacts with the other parts throughout its movement to identify potential problems earlier in the design process."
      },

      "truss-design": {
        number: "PROJECT 10 / TRUSS DESIGN",
        title: "Truss Design",
        subtitle: "Designing and building a truss while understand the math behind it",
        photo: "",
        description:
          "I designed a truss and analyzed the forces acting on its individual members. The goal was to understand how the structure carried loads and how the forces were distributed across its struts. I had to calculate which members were in tension and which were in compression, as well as determine the forces acting on each strut. This project helped me connect structural design with the physics and mathematics used to evaluate whether a structure can withstand applied loads.",
        challenges:
          "The most challenging part was completing the calculations for each member. I had to determine whether each piece was in tension or compression and calculate the forces acting on the individual struts. This required me to work through the structure systematically rather than treating the truss as a single object.",
        improvements:
          "Next, I would double-check the calculations for each member and compare the predicted forces with the behavior of a physical truss under load. This would help me evaluate how accurately my calculations represented the structure’s actual behavior."
      },

      "bridge-building": {
        number: "PROJECT 11 / BUIDING BRIDGES",
        title: "Bridge Building",
        subtitle: "Buidling a bridge to compare the effectiveness of triangle structs to square struts",
        photo: "",
        description:
          "I built a bridge in second grade and explored whether square or triangular struts would create a stronger structure. I compared the two geometric approaches to investigate how the arrangement of structural members affected the bridge’s strength. Even at that age, I was interested in understanding why one design might work better than another, rather than simply building a bridge without questioning its structure.",
        challenges:
          "The main challenge was determining whether square or triangular struts would make the stronger bridge. I had to think about how the different shapes supported the structure and how their geometry could affect its ability to withstand a load.",
        improvements:
          "If I repeated the project, I would build bridges using both configurations and test them under the same conditions. I would record how much load each bridge supported before failing and compare the results to better understand how the arrangement of structural members affects bridge strength."
      }
    };

    const key = new URLSearchParams(window.location.search).get("project");
    const project = projects[key];

    if (project) {
      document.title = project.title + " | Reyhan Kondapally";

      document.getElementById("project-number").textContent = project.number;
      document.getElementById("project-title").textContent = project.title;
      document.getElementById("project-subtitle").textContent = project.subtitle;
      document.getElementById("project-description").textContent = project.description;
      document.getElementById("project-challenges").textContent = project.challenges;
      document.getElementById("project-improvements").textContent = project.improvements;

      // Keep the existing large image at the top.
      if (project.photo) {
        const image = document.createElement("img");
        image.src = project.photo;
        image.alt = project.title + " project photograph";

        const visual = document.getElementById("project-visual");

        image.onerror = function () {
          visual.textContent = "ADD YOUR PROJECT PHOTO";
        };

        visual.textContent = "";
        visual.appendChild(image);
      } else {
        document.getElementById("project-visual").textContent =
          "ADD YOUR " + project.title.toUpperCase() + " PHOTO";
      }

      // Load a different image for each of the three sections.
      const sectionImages = [
        {
          id: "description-image",
          file: "images/" + key + "-description.jpg",
          alt: project.title + " description"
        },
        {
          id: "challenges-image",
          file: "images/" + key + "-challenges.jpg",
          alt: project.title + " challenges"
        },
        {
          id: "improvements-image",
          file: "images/" + key + "-improvements.jpg",
          alt: project.title + " improvements"
        }
      ];

      sectionImages.forEach(function (item) {
        const image = document.getElementById(item.id);

        image.src = item.file;
        image.alt = item.alt;
        image.hidden = false;

        image.onerror = function () {
          image.hidden = true;
          console.warn("Project image not found: " + item.file);
        };
      });

    } else {
      document.title = "Project Not Found | Reyhan Kondapally";

      document.getElementById("project-number").textContent = "PROJECT NOT FOUND";
      document.getElementById("project-title").textContent = "Select a project";
      document.getElementById("project-subtitle").textContent =
        "Return to the homepage and select one of the 11 project boxes.";

      document.getElementById("project-visual").style.display = "none";

      document.getElementById("project-description").textContent =
        "This project link could not be found. Return to the homepage to choose a project.";

      document.getElementById("project-challenges").textContent =
        "No project was selected.";

      document.getElementById("project-improvements").textContent =
        "Choose a project from the homepage to view its details.";

      document.getElementById("description-image").hidden = true;
      document.getElementById("challenges-image").hidden = true;
      document.getElementById("improvements-image").hidden = true;
    }
  </script>
</body>
</html>
